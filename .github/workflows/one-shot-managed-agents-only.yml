name: one-shot-managed-agents-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-managed-agents-only.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch managed-agent exposure rules
        shell: python
        run: |
          from pathlib import Path

          monitoring = Path('services/control-api/app/monitoring.py')
          text = monitoring.read_text(encoding='utf-8')
          old = '''    if device.agent_enabled:\n        online = is_agent_online(agent)\n        state, threshold = state_from_rule(1.0 if online else 0.0, rules.get("sentinel_agent_up"))\n        if not online and state == "ok":\n            state = "critical"\n        services.append({\n            "host_id": device.id,\n            "hostname": hostname,\n            "service_key": "agent:health",\n            "service_name": "Sentinel Agent",\n            "state": state,\n            "value": "online" if online else "offline",\n            "unit": None,\n            "message": f"Agent {agent.version if agent else 'not enrolled'} is {'online' if online else 'offline'}",\n            "updated_at": agent.last_checkin if agent else device.agent_last_seen,\n        })'''
          new = '''    # A Sentinel Agent service exists only after a real managed-agent enrollment.\n    # Legacy/stale Device.agent_enabled flags must never create a fake agent.\n    if agent is not None:\n        online = is_agent_online(agent)\n        state, threshold = state_from_rule(1.0 if online else 0.0, rules.get("sentinel_agent_up"))\n        if not online and state == "ok":\n            state = "critical"\n        services.append({\n            "host_id": device.id,\n            "hostname": hostname,\n            "service_key": "agent:health",\n            "service_name": "Sentinel Agent",\n            "state": state,\n            "value": "online" if online else "offline",\n            "unit": None,\n            "message": f"Agent {agent.version} is {'online' if online else 'offline'}",\n            "updated_at": agent.last_checkin,\n        })'''
          if old not in text:
              raise SystemExit('monitoring.py target block not found')
          monitoring.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('services/control-api/app/main.py')
          text = main.read_text(encoding='utf-8')
          old = '''        agent_enabled=device.agent_enabled, agent_online=is_agent_online(agent), agent_version=device.agent_version,'''
          new = '''        agent_enabled=bool(agent and not agent.revoked), agent_online=is_agent_online(agent),\n        agent_version=(agent.version if agent else None),'''
          if old not in text:
              raise SystemExit('main.py host summary target not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('services/control-api/tests/test_agent_management.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_legacy_agent_flag_does_not_create_fake_managed_agent():'
          if marker not in text:
              text += '''\n\n\ndef test_legacy_agent_flag_does_not_create_fake_managed_agent():\n    created = client.post(\n        "/api/v1/devices",\n        headers=ADMIN,\n        json={"ip_address": "192.0.2.250", "hostname": "fake-container-qa", "device_class": "server"},\n    )\n    if created.status_code == 409:\n        rows = client.get("/api/v1/devices?q=fake-container-qa", headers=ADMIN).json()\n        device_id = next(row["id"] for row in rows if row["hostname"] == "fake-container-qa")\n    else:\n        assert created.status_code == 200, created.text\n        device_id = created.json()["id"]\n\n    legacy = client.post(\n        "/api/v1/agents/register",\n        headers=ADMIN,\n        json={\n            "device_id": device_id,\n            "hostname": "fake-container-qa",\n            "advertise_address": "fake-container-qa:9123",\n            "os_name": "linux",\n            "arch": "amd64",\n            "version": "0.2.2",\n            "site": "qa",\n            "tags": ["legacy"],\n        },\n    )\n    assert legacy.status_code == 200, legacy.text\n\n    hosts = client.get("/api/v1/hosts?q=fake-container-qa", headers=ADMIN)\n    assert hosts.status_code == 200, hosts.text\n    host = next(row for row in hosts.json() if row["id"] == device_id)\n    assert host["agent_enabled"] is False\n    assert host["agent_online"] is False\n\n    services = client.get(f"/api/v1/services?host_id={device_id}", headers=ADMIN)\n    assert services.status_code == 200, services.text\n    assert not any(row["service_key"] == "agent:health" for row in services.json())\n\n    problems = client.get(f"/api/v1/problems?device_id={device_id}", headers=ADMIN)\n    assert problems.status_code == 200, problems.text\n    assert not any(row["service_key"] == "agent:health" for row in problems.json())\n\n    deleted = client.delete(f"/api/v1/devices/{device_id}", headers=ADMIN)\n    assert deleted.status_code == 200, deleted.text\n'''
              tests.write_text(text, encoding='utf-8')

          assert 'Agent not enrolled' not in monitoring.read_text(encoding='utf-8')
          assert 'agent_enabled=bool(agent and not agent.revoked)' in main.read_text(encoding='utf-8')
          assert marker in tests.read_text(encoding='utf-8')

      - name: Compile Python
        run: python -m py_compile services/control-api/app/main.py services/control-api/app/monitoring.py

      - name: Run control API tests
        run: |
          pip install -r services/control-api/requirements.txt
          PYTHONPATH=services/control-api SENTINEL_DB_URL=sqlite:////tmp/sentinel-managed-only-ci.db pytest -q services/control-api/tests

      - name: Remove one-shot workflow and commit fix to main
        run: |
          rm .github/workflows/one-shot-managed-agents-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/control-api/app/monitoring.py services/control-api/app/main.py services/control-api/tests/test_agent_management.py .github/workflows/one-shot-managed-agents-only.yml
          git commit -m 'fix(agent): only expose real managed enrollments'
          git push origin HEAD:main
