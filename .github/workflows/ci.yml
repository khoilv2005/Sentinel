name: ci

on:
  push:
  pull_request:

jobs:
  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/control-api/requirements.txt
      - name: Inspect modular API routes
        run: |
          PYTHONPATH=services/control-api SENTINEL_DB_URL=sqlite:////tmp/sentinel-ci.db python - <<'PY'
          from fastapi.routing import APIRoute
          from app.main import app

          rows = []
          all_routes = []
          for route in app.router.routes:
              route_type = f"{type(route).__module__}.{type(route).__name__}"
              path = getattr(route, "path", None)
              nested = getattr(route, "routes", None)
              all_routes.append((route_type, path, len(nested) if nested is not None else None))
              if isinstance(route, APIRoute) and any(token in route.path for token in ("notification", "maintenance", "availability")):
                  rows.append((route.path, sorted(route.methods or ()), route.endpoint.__module__, route.endpoint.__name__))
              if nested:
                  for child in nested:
                      child_path = getattr(child, "path", None)
                      if child_path and any(token in child_path for token in ("notification", "maintenance", "availability")):
                          print("NESTED_OPERATION", route_type, path, type(child).__name__, child_path, getattr(child, "methods", None), getattr(getattr(child, "endpoint", None), "__module__", None))
          print("MODULAR_ROUTE_DIAGNOSTICS", rows)
          print("ROUTE_TYPES", all_routes)
          PY
      - run: PYTHONPATH=services/control-api SENTINEL_DB_URL=sqlite:////tmp/sentinel-ci.db pytest -vv services/control-api/tests

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - working-directory: agents/sentinel-agent
        run: |
          go mod tidy
          go mod download all
          go mod verify
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/sentinel-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/sentinel-agent-windows-amd64.exe .

  ui-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: node --check services/web-ui/js/api.js
      - run: node --check services/web-ui/js/ui.js
      - run: node --check services/web-ui/js/app.js
      - run: node --check services/web-ui/js/runtime-enhancements.js
      - run: python scripts/validate-config.py
