name: sentinelview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  control-api:
    image: sentinelview-control-api:0.3.0
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-change-me-now}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_SCAN_MAX_HOSTS: ${SENTINEL_SCAN_MAX_HOSTS:-4096}
      SENTINEL_AGENT_ONLINE_SECONDS: ${SENTINEL_AGENT_ONLINE_SECONDS:-120}
      SENTINEL_PROMETHEUS_URL: ${SENTINEL_PROMETHEUS_URL:-http://prometheus:9090}
      SENTINEL_ADMIN_USER: ${SENTINEL_ADMIN_USER:-admin}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD:-admin}
      SENTINEL_SESSION_SECRET: ${SENTINEL_SESSION_SECRET:-change-me-session-secret}
      SENTINEL_CREDENTIAL_SECRET: ${SENTINEL_CREDENTIAL_SECRET:-change-me-credential-secret}
      SENTINEL_SESSION_HOURS: ${SENTINEL_SESSION_HOURS:-12}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  discovery-worker:
    image: sentinelview-control-api:0.3.0
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-change-me-now}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_SCAN_MAX_HOSTS: ${SENTINEL_SCAN_MAX_HOSTS:-4096}
      SENTINEL_AGENT_ONLINE_SECONDS: ${SENTINEL_AGENT_ONLINE_SECONDS:-120}
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      control-api:
        condition: service_healthy
    restart: unless-stopped

  agentless-worker:
    image: sentinelview-control-api:0.3.0
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    command: ["python", "-m", "app.agentless_worker"]
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_CREDENTIAL_SECRET: ${SENTINEL_CREDENTIAL_SECRET:-change-me-credential-secret}
      SENTINEL_AGENTLESS_WORKERS: ${SENTINEL_AGENTLESS_WORKERS:-24}
    depends_on:
      postgres:
        condition: service_healthy
      control-api:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    image: sentinelview-control-api:0.3.0
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    command: ["python", "-m", "app.notification_worker"]
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-INFO}
      SENTINEL_NOTIFICATION_POLL_SECONDS: ${SENTINEL_NOTIFICATION_POLL_SECONDS:-2}
      SENTINEL_NOTIFICATION_BATCH_SIZE: ${SENTINEL_NOTIFICATION_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      control-api:
        condition: service_healthy
    restart: unless-stopped

  web-ui:
    image: sentinelview-web-ui:0.3.0
    build:
      context: ./services/web-ui
    ports:
      - "3001:80"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:latest
    ports:
      - "9116:9116"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    ports:
      - "9115:9115"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    profiles: ["logs"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
