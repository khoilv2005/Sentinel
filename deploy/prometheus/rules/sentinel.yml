# SentinelView v0.4 deliberately does not define parallel Prometheus alerts.
#
# The Control API Monitoring Rules -> Services -> Problems pipeline is the
# product source of truth for alert state, acknowledgement, maintenance
# suppression, notification delivery and SLA reporting. Prometheus remains the
# time-series/history backend consumed by SentinelView and Grafana.
#
# Keeping a valid empty rule file lets existing Prometheus deployments continue
# mounting /etc/prometheus/rules without maintaining a second set of thresholds.
groups: []
